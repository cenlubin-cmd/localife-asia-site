<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Localife Nexus Global</title>
    <script>
      var segmentCount = 1;
      var locationData = window.location;
      var redirect = locationData.protocol + '//' + locationData.hostname + (locationData.port ? ':' + locationData.port : '') +
        locationData.pathname.split('/').slice(0, 1 + segmentCount).join('/') +
        '/?p=/' +
        locationData.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (locationData.search ? '&q=' + locationData.search.slice(1).replace(/&/g, '~and~') : '') +
        locationData.hash;
      location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
